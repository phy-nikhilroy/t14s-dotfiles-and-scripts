[colors]
background = #e6000000
foreground = #cdd6f4
primary = #89b4fa
disabled = #6c7086

[bar/main]
width = 100%
height = 28pt
radius = 0
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1pt
border-size = 0pt

padding-left = 1
padding-right = 2
module-margin = 2

font-0 = "JetBrainsMono Nerd Font:size=11;3"

modules-left = bspwm
modules-right = claude agyusage pulseaudio memory cpu temperature wlan battery date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-background = ${colors.background}
label-focused-underline= ${colors.primary}
label-focused-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = #f38ba8
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/claude]
type = custom/script
exec = ~/.local/bin/claude-usage
interval = 300
format-prefix = "CC "
format-prefix-foreground = #D97757

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/wlan]
type = internal/network
interface = wlp0s20f3
interface-type = wireless
interval = 3
format-connected-prefix = "WIFI "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid%
label-disconnected = OFF
label-disconnected-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%

label-muted = MUTED
label-muted-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "CHG "
format-charging-prefix-foreground = ${colors.primary}

format-discharging = <label-discharging>
format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.primary}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = FULL

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/temperature]
type = internal/temperature
thermal-zone = 6
interval = 2
base-temperature = 20
warn-temperature = 80
format-prefix = "TEMP "
format-prefix-foreground = ${colors.primary}
label = %temperature-c%
format-warn-prefix = "TEMP "
format-warn-prefix-foreground = #f38ba8
label-warn = %temperature-c%
label-warn-foreground = #f38ba8

[module/agyusage]
type = custom/script
exec = ~/.local/bin/agyusage
interval = 600
format-prefix = "AGY "
format-prefix-foreground = #a6e3a1
label = %output%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true
