# Shortcut lookup data for the `shortcuts` rofi popup.
# Neovim leader key is <space> (see nvim/lua/config/globals.lua) — written as
# "space" below for readability. tmux has no config in this repo, so its
# entries are stock tmux defaults (prefix = C-b).

- tool: tmux
  keybind: "C-b c"
  description: New window
- tool: tmux
  keybind: "C-b ,"
  description: Rename current window
- tool: tmux
  keybind: "C-b &"
  description: Kill current window
- tool: tmux
  keybind: "C-b n"
  description: Next window
- tool: tmux
  keybind: "C-b p"
  description: Previous window
- tool: tmux
  keybind: "C-b 0-9"
  description: Select window by number
- tool: tmux
  keybind: "C-b w"
  description: List windows and choose one
- tool: tmux
  keybind: 'C-b %'
  description: Split pane vertically (left/right)
- tool: tmux
  keybind: 'C-b "'
  description: Split pane horizontally (top/bottom)
- tool: tmux
  keybind: "C-b arrow"
  description: Move between panes
- tool: tmux
  keybind: "C-b o"
  description: Cycle to next pane
- tool: tmux
  keybind: "C-b q"
  description: Show pane numbers
- tool: tmux
  keybind: "C-b x"
  description: Kill current pane
- tool: tmux
  keybind: "C-b z"
  description: Toggle pane zoom
- tool: tmux
  keybind: "C-b {"
  description: Move pane left
- tool: tmux
  keybind: "C-b }"
  description: Move pane right
- tool: tmux
  keybind: "C-b space"
  description: Cycle pane layouts
- tool: tmux
  keybind: "C-b d"
  description: Detach from session
- tool: tmux
  keybind: "C-b s"
  description: List sessions and choose one
- tool: tmux
  keybind: "C-b $"
  description: Rename session
- tool: tmux
  keybind: "C-b ["
  description: Enter copy mode
- tool: tmux
  keybind: "C-b ]"
  description: Paste buffer
- tool: tmux
  keybind: "C-b ?"
  description: List all tmux keybinds

- tool: neovim
